[project]
name = "stress-alert"
version = "0.1.0"
description = "Breath-hold stress dashboard: Open-Motion blood flow plus ECG, for research only"
requires-python = ">=3.12,<3.13"
# Exact pins, each release at least two weeks old when chosen. Add with `uv add <pkg>==<version>`.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "websockets==17.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
