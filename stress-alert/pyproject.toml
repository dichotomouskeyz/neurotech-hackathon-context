[project]
name = "stress-alert"
version = "0.1.0"
description = "Open-Motion and Mentalab ECG ingest for the stress-alert demo. For research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "neurokit2>=0.2.7",
]

[project.optional-dependencies]
live = ["openmotion-sdk"]
mentalab = ["explorepy"]
lsl = ["pylsl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*", "features*"]
exclude = ["tests*"]
